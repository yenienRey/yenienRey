<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 428 428" width="400" height="400" role="img" aria-labelledby="t">
  <title id="t">Yenien, hand-drawn: bucket hat, beard and a quilted jacket, with snowy Patagonian peaks behind him</title>
  <style>
    :root { --ink: #1e2b4a; --skin: #e9b48c; --signal: #0f9e8a; }
    .ink { stroke: #1e2b4a; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; }
    .thin { stroke: #1e2b4a; stroke-width: 2.5; stroke-linecap: round; fill: none; }
    .sky-top { stop-color: #9fd0e6; } .sky-bottom { stop-color: #f3ead9; }
    .far { fill: #bccbe9; } .mid { fill: #5c85c5; } .near { fill: #2f5c9e; }
    .contour { stroke: #fff; stroke-opacity: .35; stroke-width: 2; fill: none; }
    .night { opacity: 0; }
    .eyes { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
    .brows { animation: brow 9s infinite; }
    .cursor { animation: cursor 1.1s steps(1) infinite; }
    .fog { animation: drift 18s ease-in-out infinite alternate; }
    .fog.b { animation-duration: 25s; animation-direction: alternate-reverse; }
    .stitch { stroke: #0f9e8a; stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; animation: pulse 4s ease-in-out infinite; }
    .stitch:nth-of-type(2) { animation-delay: -1s; } .stitch:nth-of-type(3) { animation-delay: -2s; } .stitch:nth-of-type(4) { animation-delay: -3s; }
    .orbit { transform-origin: 200px 200px; animation: orbit 24s linear infinite; }
    .steam path { animation: steam 3.5s ease-in-out infinite; } .steam path + path { animation-delay: -1.7s; }
    .star { animation: twinkle 3s ease-in-out infinite; }
    .star:nth-of-type(2n) { animation-delay: -1.3s; } .star:nth-of-type(3n) { animation-delay: -2.1s; }
    @keyframes blink { 0%, 93%, 97%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes brow { 0%, 80%, 90%, 100% { transform: translateY(0); } 84%, 87% { transform: translateY(-4px); } }
    @keyframes cursor { 50% { opacity: 0; } }
    @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
    @keyframes pulse { 0%, 100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 40% { opacity: .9; } 100% { opacity: 0; transform: translateY(-10px); } }
    @keyframes twinkle { 50% { opacity: .3; } }
    /* night at the lake, like yenien.com after sunset */
    @media (prefers-color-scheme: dark) {
      .sky-top { stop-color: #0d1630; } .sky-bottom { stop-color: #2a3966; }
      .far { fill: #33467a; } .mid { fill: #263a6b; } .near { fill: #1b2b55; }
      .snow { fill: #c9d6f2; }
      .contour { stroke: #6ff2dc; stroke-opacity: .18; }
      .night { opacity: 1; }
      .fog { opacity: .25; }
      .ring { stroke: #6ff2dc; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" class="sky-top"/><stop offset="1" class="sky-bottom"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="200" cy="200" r="186"/></clipPath>
  </defs>

  <g clip-path="url(#disc)">
    <rect width="400" height="400" fill="url(#sky)"/>

    <!-- night sky -->
    <g class="night" fill="#fff">
      <circle class="star" cx="70" cy="90" r="2"/><circle class="star" cx="110" cy="50" r="1.5"/>
      <circle class="star" cx="300" cy="70" r="2"/><circle class="star" cx="345" cy="120" r="1.5"/>
      <circle class="star" cx="255" cy="40" r="1.5"/><circle class="star" cx="60" cy="150" r="1.5"/>
      <circle class="star" cx="330" cy="170" r="2"/>
      <path d="M318 82 a22 22 0 1 0 12 40 a18 18 0 1 1 -12 -40 Z" fill="#f3ead9" class="ink" stroke-width="3"/>
    </g>

    <!-- peaks -->
    <path class="far ink" d="M-10 300 L70 190 L120 245 L190 150 L260 230 L320 170 L410 270 L410 410 L-10 410 Z"/>
    <path class="snow ink" fill="#fff" stroke-width="3" d="M190 150 L212 175 L203 171 L196 180 L188 172 L178 177 Z"/>
    <path class="snow ink" fill="#fff" stroke-width="3" d="M70 190 L86 211 L78 207 L71 214 L64 208 L56 210 Z"/>
    <path class="snow ink" fill="#fff" stroke-width="3" d="M320 170 L338 190 L330 187 L322 194 L314 187 L305 190 Z"/>
    <path class="mid ink" d="M-10 330 L60 270 L130 310 L200 255 L280 300 L350 260 L410 300 L410 410 L-10 410 Z"/>
    <g class="contour">
      <path d="M-10 350 C80 330 150 345 210 325 S330 330 410 320"/>
      <path d="M-10 370 C90 352 160 365 220 348 S340 352 410 342"/>
    </g>
    <path class="near ink" d="M-10 380 C80 350 320 350 410 380 L410 410 L-10 410 Z"/>

    <!-- fog from the selfie's summit -->
    <g fill="#fff">
      <ellipse class="fog" cx="70" cy="262" rx="90" ry="14" opacity=".55"/>
      <ellipse class="fog b" cx="330" cy="238" rx="80" ry="12" opacity=".5"/>
    </g>

    <g transform="translate(200 196) scale(1.2) translate(-200 -226)">
    <!-- jacket, tee, neck -->
    <path class="ink" fill="#525866" d="M24 420 C30 356 90 326 162 318 Q200 344 238 318 C310 326 370 356 376 420 Z"/>
    <path class="ink" fill="#d6c4a2" d="M170 320 Q200 350 230 320 L216 372 L200 420 L184 372 Z"/>
    <path class="ink" fill="#e9b48c" d="M176 286 L176 324 Q200 346 224 324 L224 286 Z"/>
    <path d="M180 316 Q200 330 220 316" fill="none" stroke="#c98b6a" stroke-width="5" stroke-linecap="round" opacity=".5"/>
    <path class="ink" fill="#5f6675" d="M160 316 Q138 342 166 380 L186 352 Q170 336 172 318 Z"/>
    <path class="ink" fill="#5f6675" d="M240 316 Q262 342 234 380 L214 352 Q230 336 228 318 Z"/>
    <path class="thin" d="M207 378 L212 420"/>
    <path class="ink" fill="#c9cfd8" stroke-width="2" d="M203 384 L211 384 L210 396 L204 396 Z"/>
    <path d="M236 330 C246 352 248 376 244 400" fill="none" stroke="#3a3f4a" stroke-width="4" stroke-linecap="round"/>
    <rect class="ink" fill="#d6c4a2" stroke-width="2" x="240" y="398" width="7" height="12" rx="2"/>
    <g>
      <path class="stitch" d="M58 372 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7"/>
      <path class="stitch" d="M46 398 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7"/>
      <path class="stitch" d="M276 368 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7"/>
      <path class="stitch" d="M266 396 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7 l10 -7 l10 7"/>
    </g>

    <g transform="rotate(6 200 300)">
    <!-- hair, ears, face -->
    <!-- hair: dark, wavy, out from under the hat to the jaw -->
    <g class="hair-back">
      <path fill="#3b2a21" stroke="#1e2b4a" stroke-width="3" stroke-linejoin="round" d="M154 194 C136 198 124 212 121 230 C119 244 115 254 106 262 C114 268 124 266 129 261 C127 272 121 280 112 285 C123 290 136 285 142 278 C143 286 141 292 136 299 C149 297 157 286 159 272 L160 200 Z"/>
      <path fill="#3b2a21" stroke="#1e2b4a" stroke-width="3" stroke-linejoin="round" d="M246 194 C262 198 272 210 276 226 C279 240 284 250 292 256 C284 262 276 260 271 256 C271 266 265 272 256 274 L240 200 Z"/>
      <path d="M136 226 Q130 246 116 260 M146 254 Q142 272 126 282 M264 226 Q270 242 282 254" fill="none" stroke="#6a4c38" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <ellipse class="ink" fill="#e9b48c" cx="143" cy="232" rx="10" ry="15"/>
    <ellipse class="ink" fill="#e9b48c" cx="257" cy="232" rx="10" ry="15"/>
    <path class="ink" fill="#e9b48c" d="M146 196 C146 162 254 162 254 196 L254 232 C254 278 228 304 200 306 C172 304 146 278 146 232 Z"/>

    <!-- stubble beard, with skin showing through -->
    <defs>
      <pattern id="stubble" width="6" height="6" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r="1.1" fill="#2a1d16" fill-opacity=".55"/><circle cx="4.5" cy="4.5" r="1" fill="#2a1d16" fill-opacity=".5"/>
      </pattern>
    </defs>
    <path d="M148 238 C150 286 178 310 200 310 C222 310 250 286 252 238 C246 262 234 268 222 264 C212 256 188 256 178 264 C166 268 154 262 148 238 Z" fill="#6b4a35" fill-opacity=".6"/>
    <path d="M148 238 C150 286 178 310 200 310 C222 310 250 286 252 238 C246 262 234 268 222 264 C212 256 188 256 178 264 C166 268 154 262 148 238 Z" fill="url(#stubble)"/>
    <path d="M180 282 Q200 292 220 282 Q216 304 200 306 Q184 304 180 282 Z" fill="#2a1d16" fill-opacity=".25"/>
    <path fill="#3b2a21" d="M176 262 Q200 248 224 262 Q212 259 200 261 Q188 259 176 262 Z"/>
    <path fill="#c97a68" d="M186 270 Q200 278 214 270 Q200 274 186 270 Z"/>
    <path class="thin" d="M184 270 Q200 280 216 269"/>

    <!-- nose, cheeks -->
    <path class="thin" d="M203 218 Q199 238 192 244 Q200 250 209 245"/>
    <ellipse cx="166" cy="246" rx="9" ry="5" fill="#d4493a" opacity=".16"/>
    <ellipse cx="234" cy="246" rx="9" ry="5" fill="#d4493a" opacity=".16"/>

    <!-- eyes: open, a little smiley squint -->
    <g class="eyes">
      <path d="M163 222 Q175 209 188 222 Q175 230 163 222 Z" fill="#fff" class="ink" stroke-width="2.5"/>
      <path d="M212 222 Q225 209 237 222 Q225 230 212 222 Z" fill="#fff" class="ink" stroke-width="2.5"/>
      <circle cx="177" cy="220.5" r="4.6" fill="#3b2a21"/><circle cx="226" cy="220.5" r="4.6" fill="#3b2a21"/>
      <circle cx="178.5" cy="219" r="1.4" fill="#fff"/><circle cx="227.5" cy="219" r="1.4" fill="#fff"/>
    </g>
    <g class="thin" stroke-width="2" opacity=".55">
      <path d="M165 230 Q175 234 186 230"/><path d="M214 230 Q225 234 235 230"/>
    </g>
    <g class="brows" fill="none" stroke="#3b2a21" stroke-width="5.5" stroke-linecap="round">
      <path d="M161 208 Q174 200 189 206"/>
      <path d="M211 206 Q226 200 239 208"/>
    </g>

    <!-- bucket hat, with a terminal patch -->
    <path class="ink" fill="#d9c29a" d="M150 192 C146 150 166 132 200 132 C234 132 254 150 250 192 Z"/>
    <path d="M152 178 Q200 168 248 178" fill="none" stroke="#b9a073" stroke-width="3" stroke-linecap="round"/>
    <path class="ink" fill="#cdb489" d="M104 206 Q200 160 296 206 Q302 218 288 216 Q200 184 112 216 Q98 218 104 206 Z"/>
    <path d="M118 208 Q200 174 282 208" fill="none" stroke="#b9a073" stroke-width="2" stroke-dasharray="3 5"/>
    <rect class="ink" fill="#1e2b4a" stroke-width="2.5" x="182" y="146" width="36" height="22" rx="4"/>
    <path d="M188 152 l6 5 l-6 5" fill="none" stroke="#6ff2dc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect class="cursor" x="198" y="160" width="10" height="3" fill="#6ff2dc"/>
    </g>
    </g>

    <!-- a mate, never far away -->
    <g transform="translate(262 300) scale(1.1)">
      <g class="steam" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".8">
        <path d="M2 -14 q-6 -8 0 -16 q6 -8 0 -16"/>
        <path d="M14 -10 q-5 -7 0 -14 q5 -7 0 -14"/>
      </g>
      <path class="ink" fill="#c9cfd8" stroke-width="3" d="M24 -40 L30 -6" />
      <path class="ink" fill="#8a5a3a" d="M-14 -4 C-16 30 -4 46 10 46 C24 46 36 30 34 -4 Z"/>
      <ellipse class="ink" cx="10" cy="-4" rx="24" ry="7" fill="#c9cfd8" stroke-width="3"/>
      <ellipse cx="10" cy="-4" rx="17" ry="4" fill="#7f9a3c"/>
      <path class="ink" fill="#c9cfd8" stroke-width="3" d="M20 -2 L26 -40 L32 -42 L30 -38 L24 -2 Z"/>
      <path d="M-12 16 Q10 24 32 16" fill="none" stroke="#c9cfd8" stroke-width="4"/>
      <path class="ink" fill="#e9b48c" d="M-18 22 C-22 40 -6 52 10 50 C22 50 30 44 34 38 C20 40 2 36 -18 22 Z"/>
    </g>
  </g>

  <circle class="ring" cx="200" cy="200" r="186" fill="none" stroke="#1e2b4a" stroke-width="7"/>

  <!-- a satellite circling the disc -->
  <g class="orbit">
    <g transform="translate(200 4) rotate(20)">
      <rect class="ink" x="-6" y="-6" width="12" height="12" fill="#f3ead9" stroke-width="2.5"/>
      <rect class="ink" x="-24" y="-4" width="14" height="8" fill="#0f9e8a" stroke-width="2"/>
      <rect class="ink" x="10" y="-4" width="14" height="8" fill="#0f9e8a" stroke-width="2"/>
    </g>
  </g>
</svg>
